<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#141729"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <text x="100" y="60" font-family="monospace" font-size="32" font-weight="bold" fill="#e8e8e8">NeuroSavant 2.0</text>
  <text x="100" y="90" font-family="monospace" font-size="14" fill="#aaaaaa">Hierarchical Memory System</text>

  <rect x="60" y="120" width="480" height="160" rx="10" fill="#1a1d2e" stroke="#a78bfa" stroke-width="2"/>
  <text x="80" y="160" font-family="monospace" font-size="20" font-weight="bold" fill="#a78bfa">CLI / AGENT</text>
  <text x="80" y="190" font-family="monospace" font-size="13" fill="#ffffff">Commands + Agentic Chat</text>
  <text x="80" y="220" font-family="monospace" font-size="11" fill="#bbbbbb">/status · /story · /sleep · /infinite</text>
  <text x="80" y="245" font-family="monospace" font-size="11" fill="#bbbbbb">LLM function calling</text>

  <rect x="60" y="300" width="480" height="160" rx="10" fill="#1a1d2e" stroke="#5eead4" stroke-width="2"/>
  <text x="80" y="340" font-family="monospace" font-size="20" font-weight="bold" fill="#5eead4">MEMORY ENGINE</text>
  <text x="80" y="370" font-family="monospace" font-size="13" fill="#ffffff">ChromaDB Hierarchical Storage</text>
  <text x="80" y="400" font-family="monospace" font-size="11" fill="#bbbbbb">Groups → Cells → Entities</text>
  <text x="80" y="425" font-family="monospace" font-size="11" fill="#bbbbbb">Online clustering · Sleep merging</text>

  <rect x="60" y="480" width="480" height="160" rx="10" fill="#1a1d2e" stroke="#f472b6" stroke-width="2"/>
  <text x="80" y="520" font-family="monospace" font-size="20" font-weight="bold" fill="#f472b6">OLLAMA</text>
  <text x="80" y="550" font-family="monospace" font-size="13" fill="#ffffff">Local LLM + Embeddings</text>
  <text x="80" y="580" font-family="monospace" font-size="11" fill="#bbbbbb">DeepSeek-R1 · nomic-embed</text>
  <text x="80" y="605" font-family="monospace" font-size="11" fill="#bbbbbb">768-dim vectors</text>

  <rect x="580" y="120" width="540" height="100" rx="8" fill="#1a1d2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="600" y="160" font-family="monospace" font-size="16" font-weight="bold" fill="#a78bfa">TOOLS</text>
  <text x="600" y="185" font-family="monospace" font-size="12" fill="#bbbbbb">Storyline · GitHub Ingest · Behavior</text>
  <text x="600" y="205" font-family="monospace" font-size="12" fill="#bbbbbb">Infinite Loop · Perf Tracker</text>

  <rect x="580" y="240" width="540" height="60" rx="8" fill="#1a1d2e" stroke="#5eead4" stroke-width="1"/>
  <text x="600" y="278" font-family="monospace" font-size="13" fill="#aaaaaa">Python · ChromaDB · Ollama · NumPy</text>

  <rect x="580" y="320" width="540" height="320" rx="10" fill="#1a1d2e" stroke="#333333" stroke-width="1"/>
  <text x="600" y="360" font-family="monospace" font-size="13" fill="#555555">Architecture Flow:</text>
  <text x="600" y="400" font-family="monospace" font-size="14" fill="#a78bfa">CLI/Agent</text>
  <text x="680" y="400" font-family="monospace" font-size="14" fill="#888888">→</text>
  <text x="710" y="400" font-family="monospace" font-size="14" fill="#5eead4">Memory Engine</text>
  <text x="850" y="400" font-family="monospace" font-size="14" fill="#888888">→</text>
  <text x="880" y="400" font-family="monospace" font-size="14" fill="#f472b6">Ollama</text>
  <text x="600" y="440" font-family="monospace" font-size="11" fill="#666666">· Hierarchical memory with entity recall</text>
  <text x="600" y="465" font-family="monospace" font-size="11" fill="#666666">· Local inference via Ollama backend</text>
  <text x="600" y="490" font-family="monospace" font-size="11" fill="#666666">· Extensible tool framework</text>
  <text x="600" y="515" font-family="monospace" font-size="11" fill="#666666">· Online clustering + sleep consolidation</text>

</svg>